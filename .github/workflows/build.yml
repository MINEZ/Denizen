# MINEZ：本 fork 的构建。每次推送都构建插件 jar 并上传为 Artifact，发 Release 时从这里取 jar 作为附件。
# Denizen 对多个版本的 Spigot 服务端编译，而 Spigot 服务端 jar 不在任何公开的 Maven 仓库中，只能用 BuildTools 在本地生成：
# 这里按版本生成并存进 Actions 缓存，缓存命中时跳过。1.21.11 及更早的版本须 --remapped；各版本的 BuildTools 须以其支持的 Java 运行
# （见 https://hub.spigotmc.org/versions/<版本>.json 的 javaVersions），因此另装 JDK 17 与 21。
# 第三方 action 固定到提交：标签可以被移动，而这里构建出的 jar 会部署到服务器上。
name: Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '构建号，留空时取 .github/build-number 中的值；只在需要临时改用别的构建号时填写'
        required: false
  push:
    branches:
      - dev
    paths-ignore:
      - '.gitignore'
      - 'CONTRIBUTING.md'
      - 'LICENSE.txt'
      - 'README.md'
      - 'docs/**'
      - 'licenses/**'
  # Actions 缓存 7 天没有用到就会被清除，重新生成全部 Spigot 版本要一个小时以上。每周构建一次，免得缓存过期。
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

# 同一分支上有新的推送时，取消还在运行的旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Denizen
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # 版本与各模块 pom.xml 中的 spigot 版本一致；新增或去掉版本时一并修改，缓存键随之变化。
      - name: Restore Spigot
        id: spigot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-1.17.1-1.18.2-1.19.4-1.20.6-1.21.11-26.1.2-26.2-26.3-v1

      - name: Set up JDK 17 and 21 for BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Spigot
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildtools && cd buildtools
          curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          build() {
            "$1/bin/java" -jar BuildTools.jar --rev "$2" --compile spigot $3
          }
          build "$JAVA_HOME_17_X64" 1.17.1 --remapped
          build "$JAVA_HOME_17_X64" 1.18.2 --remapped
          build "$JAVA_HOME_17_X64" 1.19.4 --remapped
          build "$JAVA_HOME_21_X64" 1.20.6 --remapped
          build "$JAVA_HOME_21_X64" 1.21.11 --remapped
          build "$JAVA_HOME" 26.1.2
          build "$JAVA_HOME" 26.2
          build "$JAVA_HOME" 26.3

      # 其余依赖（DenizenCore、Paper 等）另行缓存，不含上面的 Spigot。
      - name: Restore Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/spigotmc
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # 使用固定的 Maven 3.9.11，与本机构建一致。运行环境自带的 Maven 3.10 会核对本地仓库中的文件来自哪个远程仓库：paper 模块的
      # pom.xml 没有父 POM，只列了 PaperMC 仓库，它依赖的 citizens-main 是先构建的 plugin 模块从 maven.citizensnpcs.co 下载的，
      # Maven 3.10 便拒绝在 paper 模块中使用（首次构建因此失败），3.9.11 照常使用。上游的 paper/pom.xml 相同，这里不改它，以免同步时冲突。
      - name: Set up Maven
        run: |
          curl -fsSL -o maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz
          echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  maven.tar.gz" | sha512sum -c -
          tar -xzf maven.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"

      # 构建号写在 .github/build-number 中，格式为 <上游构建号>.<Fork 修订号>，例如 7314.1。它决定插件版本与 jar 的文件名，
      # 同步上游或改了代码时一并修改（与 Geyser 的 minezRevision 相同）；文件在本 fork 独有的 .github 中，同步上游时不会冲突。
      - name: Build
        run: |
          build_number="${BUILD_NUMBER:-$(tr -d '[:space:]' < .github/build-number)}"
          if ! [[ "$build_number" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "构建号“$build_number”的格式不对，应为 <上游构建号>.<Fork 修订号>，例如 7314.1" >&2
            exit 1
          fi
          # -U：paper 模块的 paper-api 版本是范围 [26.3.build,)，缓存中的版本列表可能过时，解析到较旧的构建（缺少新 API，例如 254 起才有的 WorldClock）。
          mvn -B -U clean package -DBUILD_NUMBER="$build_number" -DBUILD_CLASS=DEV
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}

      - name: Upload Denizen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Denizen
          path: target/Denizen-*.jar
          if-no-files-found: error
